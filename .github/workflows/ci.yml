name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore dependencies
        run: dotnet restore SmartLightController.sln --locked-mode

      - name: Verify formatting
        run: dotnet format SmartLightController.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build SmartLightController.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/SmartLightController.UnitTests/SmartLightController.UnitTests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory artifacts/coverage/unit

      - name: Run integration tests
        run: dotnet test tests/SmartLightController.IntegrationTests/SmartLightController.IntegrationTests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory artifacts/coverage/integration

      - name: Run acceptance tests
        run: dotnet test tests/SmartLightController.AcceptanceTests/SmartLightController.AcceptanceTests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory artifacts/coverage/acceptance

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: artifacts/coverage/**/coverage.cobertura.xml
          if-no-files-found: error

      - name: Audit runtime dependencies
        run: dotnet package list --project src/SmartLightController/SmartLightController.csproj --vulnerable --include-transitive --no-restore
